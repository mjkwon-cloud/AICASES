<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글로벌팀 업무 자동화 사례</title>
<style>
/* ============================================================
   1. Design Tokens
   ============================================================ */
:root{
  --bg:#fff; --fg:#0a0a0a; --primary:#171717; --primary-fg:#fafafa;
  --secondary:#f5f5f5; --muted-fg:#737373; --border:#e5e5e5;
  --accent:#2563eb; --accent-muted:#eff6ff; --accent-border:#bfdbfe;
  --advanced:#7c3aed; --advanced-muted:#faf5ff;
  --automation:#0d9488; --automation-muted:#f0fdfa;
  --radius:.5rem; --radius-full:9999px;
  --sidebar-width:260px;
  --sidebar-transition:.22s ease;
  --slide-transition:.28s cubic-bezier(.4,0,.2,1);
}

/* ============================================================
   2. Reset & Base
   ============================================================ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
  background:var(--bg);color:var(--fg);line-height:1.5;display:flex;flex-direction:column;
}

/* ============================================================
   3. Course Tabs  (좌상단 기초/심화/자동화 pill)
   ============================================================ */
.course-tabs{display:flex;gap:.2rem;background:var(--secondary);padding:.2rem;border-radius:var(--radius-full)}
.course-tab{
  padding:.35rem 1rem;border:none;border-radius:var(--radius-full);background:transparent;
  font:600 .875rem/1.5 inherit;color:var(--muted-fg);cursor:pointer;white-space:nowrap;
  transition:background .18s,color .18s;
}
.course-tab.active{background:var(--primary);color:var(--primary-fg)}

/* ============================================================
   4. Layout
   ============================================================ */
.app-body{display:flex;flex:1;min-height:0;overflow:hidden}

/* ============================================================
   5. Sidebar  (접기 애니메이션: width 0 트랜지션)
   ============================================================ */
.sidebar{
  width:var(--sidebar-width);flex-shrink:0;background:#fafafa;
  border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;
  transition:width var(--sidebar-transition),border-color var(--sidebar-transition);
}
.sidebar.collapsed{width:0;border-right-color:transparent}
/* inner 폭을 고정해 접힐 때 텍스트가 리플로우되지 않게 한다 */
.sidebar-inner{width:var(--sidebar-width);height:100%;display:flex;flex-direction:column;overflow:hidden}

.sidebar-header{padding:.75rem .75rem .625rem;flex-shrink:0;border-bottom:1px solid var(--border)}
.sidebar-top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.75rem}

.sidebar-toggle{
  width:32px;height:32px;flex-shrink:0;margin-left:auto;display:flex;align-items:center;justify-content:center;
  border:none;border-radius:var(--radius);background:transparent;color:var(--muted-fg);cursor:pointer;
  transition:background .14s,color .14s;
}
.sidebar-toggle:hover{background:var(--secondary);color:var(--fg)}

/* 접힌 상태에서 나타나는 재열기 버튼 */
.sidebar-reopen{
  position:absolute;top:.75rem;left:.75rem;z-index:50;width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);
  color:var(--muted-fg);cursor:pointer;opacity:0;pointer-events:none;
  transition:opacity .2s,background .14s,color .14s;
}
.sidebar-reopen.visible{opacity:1;pointer-events:auto}
.sidebar-reopen:hover{background:var(--secondary);color:var(--fg)}

.sidebar-course-badge{
  display:inline-flex;padding:.2rem .625rem;margin-bottom:.5rem;border-radius:var(--radius-full);
  font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
}
.sidebar-course-badge.basic{background:var(--accent-muted);color:var(--accent)}
.sidebar-course-badge.advanced{background:var(--advanced-muted);color:var(--advanced)}
.sidebar-course-badge.automation{background:var(--automation-muted);color:var(--automation)}
.sidebar-course-title{font-size:.9375rem;font-weight:700;line-height:1.4}

.sidebar-nav{flex:1;overflow-y:auto;padding:.375rem .75rem 1rem;scrollbar-width:thin}
.sidebar-nav::-webkit-scrollbar{width:4px}
.sidebar-nav::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.nav-item{
  display:flex;align-items:flex-start;gap:.625rem;width:100%;
  padding:.5rem .625rem;margin-bottom:.125rem;border:none;border-radius:var(--radius);
  background:transparent;text-align:left;cursor:pointer;font:inherit;transition:background .13s;
}
.nav-item:hover{background:var(--border)}
.nav-item.active{background:var(--primary)}

/* 비활성 회차 흐리게 — :has() 로 JS 없이 처리 */
.nav-group{opacity:.38;transition:opacity .18s}
.nav-group:has(.nav-item.active){opacity:1}
.nav-group:not(:has(.nav-item.active)):hover{opacity:1}
.nav-group:not(:has(.nav-item.active)):hover .nav-item:hover{background:transparent;outline:1.5px solid var(--fg)}

.nav-num{min-width:18px;flex-shrink:0;padding-top:.15rem;font-size:.75rem;font-weight:700;letter-spacing:.04em;color:var(--muted-fg)}
.nav-item.active .nav-num{color:rgba(255,255,255,.45)}
.nav-info{display:flex;flex-direction:column;gap:.1rem;min-width:0}
.nav-title{font-size:.875rem;font-weight:600;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item.active .nav-title{color:var(--primary-fg)}
.nav-hours{font-size:.75rem;color:var(--muted-fg)}
.nav-item.active .nav-hours{color:rgba(255,255,255,.4)}

/* ============================================================
   6. Slide Area  (스텝 전환: absolute + translateX)
   ============================================================ */
.slide-area{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.slides-container{position:relative;flex:1;min-height:0;overflow:hidden}

.slide{
  position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;
  padding:1.25rem 1.75rem 1rem;
  transform:translateX(100%);transition:transform var(--slide-transition);will-change:transform;
}
.slide.is-prev{transform:translateX(-100%)}
.slide.is-active{transform:translateX(0)}

/* ============================================================
   7. Session Header + Action Box  (우상단 파일/링크 박스)
   ============================================================ */
.session-inner{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.session-header{
  flex-shrink:0;display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;
  margin-bottom:.875rem;padding-bottom:.875rem;border-bottom:1px solid var(--border);
}
.session-header-left{flex:1;min-width:0}
.session-meta{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem}
.session-title{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;line-height:1.3}

.slide-action-box{
  flex-shrink:0;max-width:520px;display:flex;flex-direction:column;gap:.3rem;
  padding:.45rem .75rem;background:var(--bg);border:1px solid var(--border);border-radius:10px;
}
/* action 이 없는 슬라이드에서는 박스 자체를 숨긴다 */
.slide-action-box:empty{display:none}

.action-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-fg);white-space:nowrap}
.action-copy-row{
  display:flex;align-items:center;gap:.375rem;min-width:0;padding:.35rem .5rem;
  background:#fff;border:1px solid var(--border);border-radius:6px;cursor:pointer;
}
.action-copy-row:hover{background:#f0f4ff}
.action-item-desc{min-width:36px;flex-shrink:0;font-size:11px;color:var(--muted-fg)}
.action-copy-code{
  flex:1;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
  color:#374151;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.action-copy-btn{flex-shrink:0;padding:0 0 0 .25rem;border:none;background:none;font-size:11px;color:#9ca3af;cursor:pointer}
.action-download-link{
  display:flex;align-items:center;gap:.4rem;flex-shrink:0;padding:.3rem 0;
  font-size:13px;color:#1d4ed8;text-decoration:none;white-space:nowrap;
}
.action-download-link:hover{text-decoration:underline}

/* ============================================================
   8. Body — 이미지 슬라이더
   ============================================================ */
.session-body{flex:1;min-height:0;display:grid;grid-template-columns:1fr;overflow:hidden}
.body-image{position:relative;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.image-slider{position:relative;flex:1;min-height:0;overflow:hidden;background:#fff;border:1px solid var(--border);border-radius:var(--radius)}
.image-slide{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  transform:translateX(100%);transition:transform var(--slide-transition);will-change:transform;
}
.image-slide.is-prev{transform:translateX(-100%)}
.image-slide.is-active{transform:translateX(0)}
.image-slide img{max-width:100%;max-height:100%;object-fit:contain;display:block}

.image-placeholder{
  width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;
  border:2px dashed var(--border);border-radius:var(--radius);
}
.image-placeholder-label{font-size:.875rem;font-weight:600;color:var(--muted-fg)}
.image-placeholder-sub{font-size:.75rem;color:var(--muted-fg);opacity:.7}

.image-expand-btn{
  position:absolute;bottom:.5rem;right:.5rem;z-index:10;width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  border:none;border-radius:6px;background:rgba(0,0,0,.35);color:#fff;cursor:pointer;
  opacity:0;transition:opacity .18s,background .18s;
}
.body-image:hover .image-expand-btn{opacity:1}
.image-expand-btn:hover{background:rgba(0,0,0,.6)}

/* 설명 패널 — 필요하면 display:flex 로 켠다 */
.body-desc{display:none}

/* ============================================================
   9. Slide Navigation
   ============================================================ */
.slide-nav{
  height:52px;min-height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  gap:1rem;padding:0 1.5rem;background:var(--bg);border-top:1px solid var(--border);
}
.slide-btn{
  display:flex;align-items:center;gap:.375rem;padding:.35rem .875rem;
  border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);
  font:600 .875rem/1.5 inherit;color:var(--fg);cursor:pointer;white-space:nowrap;
  transition:background .13s,border-color .13s,opacity .13s;
}
.slide-btn:hover:not(:disabled){background:var(--secondary);border-color:#d4d4d4}
.slide-btn:disabled{opacity:.3;cursor:not-allowed}
.slide-indicator{display:flex;flex-direction:column;align-items:center;gap:.375rem}
.slide-counter{font-size:.75rem;font-weight:700;letter-spacing:.06em;color:var(--muted-fg)}
.slide-dots{display:flex;gap:.3rem}
.slide-dot{
  width:6px;height:6px;padding:0;border:none;border-radius:3px;background:var(--border);
  cursor:pointer;transition:background .18s,width .18s;
}
.slide-dot.active{background:var(--primary);width:16px}

/* ============================================================
   10. Badges
   ============================================================ */
.badge-basic,.badge-advanced,.badge-automation,.badge-hours{
  padding:.2rem .625rem;border-radius:var(--radius-full);
  font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
}
.badge-basic{background:var(--accent-muted);color:var(--accent)}
.badge-advanced{background:var(--advanced-muted);color:var(--advanced)}
.badge-automation{background:var(--automation-muted);color:var(--automation)}
.badge-hours{background:var(--secondary);color:var(--muted-fg);font-weight:600;text-transform:none}

/* ============================================================
   11. Fullscreen Overlay
   ============================================================ */
.fs-overlay{position:fixed;inset:0;z-index:2000;background:#000;display:flex;align-items:center;justify-content:center}
.fs-overlay[hidden]{display:none}
.fs-image-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.fs-image-wrap img{width:100%;height:100%;object-fit:contain;display:block}
.fs-nav{
  position:absolute;top:50%;transform:translateY(-50%);z-index:10;width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
  border:none;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;transition:background .15s;
}
.fs-nav:hover{background:rgba(255,255,255,.25)}
.fs-nav:disabled{opacity:.2;cursor:default}
.fs-nav.prev{left:1.25rem}
.fs-nav.next{right:1.25rem}
.fs-ui{position:absolute;bottom:1.25rem;right:1.25rem;z-index:10;display:flex;align-items:center;gap:.75rem}
.fs-counter{font-size:13px;font-weight:600;letter-spacing:.04em;color:rgba(255,255,255,.6)}
.fs-close{
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  border:none;border-radius:6px;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;transition:background .15s;
}
.fs-close:hover{background:rgba(255,255,255,.25)}

/* ============================================================
   12. Mobile (<=768px) — 사이드바를 오버레이로, 슬라이드는 페이드로
   ============================================================ */
@media (max-width:768px){
  html,body{height:auto;overflow:auto}
  .app-body{flex-direction:column;min-height:100vh;overflow:auto}
  .sidebar{
    position:fixed;top:0;left:0;height:100%;z-index:100;
    width:var(--sidebar-width)!important;box-shadow:2px 0 12px rgba(0,0,0,.15);
    transform:translateX(0);transition:transform var(--sidebar-transition);
  }
  .sidebar.collapsed{transform:translateX(-100%);width:var(--sidebar-width)!important;border-right-color:var(--border)}
  .sidebar-reopen{opacity:1!important;pointer-events:auto!important}
  .slide-area{flex:none;width:100%;height:auto;overflow:visible}
  .slides-container{height:auto;overflow:visible}
  .slide{position:relative;transform:none!important;display:none}
  .slide.is-active{display:block}
  .session-inner{height:auto;padding:1rem;overflow:visible}
  .session-header{flex-direction:column;gap:.75rem}
  .slide-action-box{width:100%;max-width:100%}
  .session-title{font-size:1.25rem}
  .session-body{height:auto;overflow:visible}
  .body-image{overflow:visible}
  .image-slider{position:relative;height:0;padding-bottom:56.25%;overflow:hidden}
  .image-slide{position:absolute;inset:0;opacity:0;transform:none!important;transition:opacity .22s}
  .image-slide.is-active{opacity:1}
  .slide-nav{padding:.5rem 1rem}
  .slide-dots{flex-wrap:wrap;max-width:60vw}
}
</style>
</head>

</div>

<!-- Fullscreen overlay -->
<div class="fs-overlay" id="fs-overlay" hidden>

    </svg>
  </button>
  <div class="fs-image-wrap"><img id="fs-img" src="" alt=""></div>
  <button class="fs-nav next" id="fs-next">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <path d="M7 4l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <div class="fs-ui">
    <span class="fs-counter" id="fs-counter"></span>
    <button class="fs-close" id="fs-close" title="닫기 (ESC)">

        <path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>

   ============================================================ */
const COURSE_KEYS = Object.keys(COURSES);
let currentCourse  = COURSE_KEYS[0];
let currentSession = 0;   // 회차(스텝) 인덱스
let currentSlide   = 0;   // 회차 내 슬라이드 인덱스

const esc = s => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pad = n => String(n).padStart(2,'0');

/* ============================================================
   URL Hash  (#course/session/slide) — 딥링크
   ============================================================ */
function pushHash(){
  const hash = `#${currentCourse}/${currentSession+1}/${currentSlide+1}`;
  if (location.hash !== hash) history.replaceState(null,'',hash);
}

function readHash(){
  const raw = location.hash.replace('#','');
  if (!raw) return;
  const [course, s, i] = raw.split('/');
  if (!COURSES[course]) return;
  currentCourse  = course;
  const sessions = COURSES[course].sessions;
  currentSession = Math.min(Math.max((parseInt(s)||1)-1, 0), sessions.length-1);
  currentSlide   = Math.min(Math.max((parseInt(i)||1)-1, 0), slideCount(sessions[currentSession])-1);
}

/* ============================================================
   Helpers
   ============================================================ */
const slideCount  = session => Math.max(session.slides?.length || 0, 1);
const curSession  = () => COURSES[currentCourse].sessions[currentSession];
const curSlideObj = () => curSession().slides?.[currentSlide] || {};

/* ============================================================
   Render — Course Tabs
   ============================================================ */
function renderTabs(){
  const wrap = document.getElementById('course-tabs');
  // 사례(코스)가 1개뿐이면 상단 탭을 숨긴다 — 2개 이상이 되면 자동으로 다시 나타난다
  if (COURSE_KEYS.length < 2){ wrap.style.display = 'none'; return; }
  wrap.innerHTML = COURSE_KEYS.map(k =>
    `<button class="course-tab${k===currentCourse?' active':''}" data-course="${k}">${esc(COURSES[k].tabLabel)}</button>`
  ).join('');
  document.querySelectorAll('.course-tab').forEach(tab => {
    tab.addEventListener('click', () => switchCourse(tab.dataset.course));
  });
}

/* ============================================================
   Render — Sidebar
   ============================================================ */
function renderSidebar(){
  const data = COURSES[currentCourse];
  const badge = document.getElementById('sidebar-badge');
  badge.className = `sidebar-course-badge ${data.badgeClass}`;
  badge.textContent = data.badgeText;
  document.getElementById('sidebar-title').textContent = data.title;

  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = data.sessions.map((s,i) => `
    <div class="nav-group">
      <button class="nav-item${i===currentSession?' active':''}" data-index="${i}">
        <span class="nav-num">${pad(s.step)}</span>
        <span class="nav-info">
          <span class="nav-title">${esc(s.title)}</span>
          <span class="nav-hours">${esc(s.hours||'')}</span>
        </span>
      </button>
    </div>`).join('');

  nav.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => goToSession(parseInt(item.dataset.index)));
  });
}

function updateSidebarActive(){
  document.querySelectorAll('.nav-item').forEach((el,i) => el.classList.toggle('active', i===currentSession));
}

/* ============================================================
   Render — Slides
   ============================================================ */
function imagePath(course, step, filename){
  return `assets/${course}/step${pad(step)}/${filename}`;
}

function placeholderHtml(label, sub){
  return `<div class="image-placeholder">
    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" style="opacity:.35">
      <rect x="4" y="8" width="32" height="24" rx="3" stroke="#a3a3a3" stroke-width="2"/>
      <circle cx="14" cy="17" r="3" stroke="#a3a3a3" stroke-width="1.5"/>
      <path d="M4 26l8-6 6 5 6-4 12 8" stroke="#a3a3a3" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>
    <span class="image-placeholder-label">${esc(label)}</span>
    <span class="image-placeholder-sub">${esc(sub)}</span>
  </div>`;
}

function renderSlides(){
  const data = COURSES[currentCourse];
  document.getElementById('slides-container').innerHTML = data.sessions.map((s,i) => {
    const imagesHtml = (s.slides?.length ? s.slides : [null]).map((sl,j) => {
      if (!sl || !sl.image){
        return `<div class="image-slide${j===0?' is-active':''}" data-img-index="${j}">
          ${placeholderHtml('이미지 준비 중', `${s.title} · 슬라이드 ${j+1}`)}
        </div>`;
      }
      const src = imagePath(currentCourse, s.step, sl.image);
      // 현재 회차의 첫 장만 즉시 로드, 나머지는 data-src 로 lazy
      const attr = (i===currentSession && j===0) ? `src="${esc(src)}"` : `data-src="${esc(src)}"`;
      return `<div class="image-slide${j===0?' is-active':''}" data-img-index="${j}">
        <img ${attr} alt="${esc(s.title)} - ${j+1}"
          onerror="if(!this.dataset.src){this.style.display='none';this.nextElementSibling.style.display='flex'}">
        <div style="display:none;width:100%;height:100%">${placeholderHtml('이미지 없음', esc(sl.image))}</div>
      </div>`;
    }).join('');

    return `
    <div class="slide${i===currentSession?' is-active':''}" data-step-index="${i}">
      <div class="session-inner">
        <div class="session-header">
          <div class="session-header-left">
            <div class="session-meta">
              <span class="badge-${data.badgeClass}">${esc(data.badgeText)} ${pad(s.step)}</span>
              ${s.hours ? `<span class="badge-hours">${esc(s.hours)}</span>` : ''}
            </div>
            <h1 class="session-title">${esc(s.title)}</h1>
          </div>
          <div class="slide-action-box"></div>
        </div>
        <div class="session-body">
          <div class="body-image">
            <div class="image-slider">${imagesHtml}</div>
            <button class="image-expand-btn" title="전체화면">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M1 5V1h4M9 1h4v4M13 9v4H9M5 13H1V9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ============================================================
   Position — translateX 로 회차 / 슬라이드 전환
   ============================================================ */
function applySlidePositions(){
  document.querySelectorAll('.slide').forEach((el,i) => {
    el.classList.remove('is-prev','is-active');
    if (i < currentSession) el.classList.add('is-prev');
    else if (i === currentSession) el.classList.add('is-active');
  });
}

function applyImageSlidePositions(){
  document.querySelectorAll('.slide').forEach((slideEl, stepIdx) => {
    slideEl.querySelectorAll('.image-slide').forEach((el, j) => {
      el.classList.remove('is-prev','is-active');
      if (stepIdx === currentSession){
        if (j < currentSlide) el.classList.add('is-prev');
        else if (j === currentSlide) el.classList.add('is-active');
        // 현재 + 다음 장 lazy load
        if (j === currentSlide || j === currentSlide+1){
          const img = el.querySelector('img[data-src]');
          if (img){ img.src = img.dataset.src; delete img.dataset.src; }
        }
      } else if (j === 0){
        el.classList.add('is-active');
      }
    });
  });
}

/* ============================================================
   Action Box — 슬라이드별 파일/링크/복사 렌더
   ============================================================ */
function updateActionBox(){
  const box = document.querySelector('.slide.is-active .slide-action-box');
  if (!box) return;
  const act = curSlideObj().action;
  if (!act){ box.innerHTML = ''; return; }

  let html = '';
  if (act.label) html += `<div class="action-label">${esc(act.label)}</div>`;

  // 단일 복사
  if (act.copy){
    html += `<div class="action-copy-row" data-copy="${esc(act.copy)}">
      <code class="action-copy-code">${esc(act.copy)}</code>
      <span class="action-copy-btn">복사</span></div>`;
  }

  // 여러 항목 (복사 / 링크 혼합)
  (act.items || []).forEach(item => {
    if (item.link){
      html += `<a class="action-download-link" href="${esc(item.link.href)}" target="_blank" rel="noopener">`
            + (item.desc ? `${esc(item.desc)} — ` : '')
            + `${esc(item.link.text)}</a>`;
    } else if (item.copy){
      html += `<div class="action-copy-row" data-copy="${esc(item.copy)}">`
            + (item.desc ? `<span class="action-item-desc">${esc(item.desc)}</span>` : '')
            + `<code class="action-copy-code">${esc(item.copy)}</code>
               <span class="action-copy-btn">복사</span></div>`;
    }
  });

  // 외부 문서 링크
  if (act.download){
    html += `<a class="action-download-link" href="${esc(act.download.href)}" target="_blank" rel="noopener">↓ ${esc(act.download.text)}</a>`;
  }

  // 레포 내 실제 파일 다운로드 / 폴더 zip / 일반 링크
  if (act.type === 'download' && act.path){
    const fname = act.path.split('/').pop();
    html += `<a class="action-download-link" href="${esc(act.path)}" download>↓ ${esc(act.text || fname)}</a>`;
  } else if (act.type === 'download-folder' && act.path){
    const zip = act.path.endsWith('.zip') ? act.path : act.path + '.zip';
    html += `<a class="action-download-link" href="${esc(zip)}" download>↓ ${esc(act.text || '템플릿 다운로드')} (zip)</a>`;
  } else if (act.type === 'link' && act.url){
    html += `<a class="action-download-link" href="${esc(act.url)}" target="_blank" rel="noopener">→ ${esc(act.text || act.url)}</a>`;
  }

  box.innerHTML = html;
}

function copyToClipboard(text, row){
  navigator.clipboard.writeText(text).then(() => {
    const btn = row.querySelector('.action-copy-btn');
    if (!btn) return;
    btn.textContent = '완료';
    setTimeout(() => { btn.textContent = '복사'; }, 1500);
  });
}

/* ============================================================
   Navigation
   ============================================================ */
function renderDots(){
  const n = slideCount(curSession());
  const dots = document.getElementById('slide-dots');
  dots.innerHTML = Array.from({length:n}, (_,i) =>
    `<button class="slide-dot${i===currentSlide?' active':''}" data-index="${i}"></button>`).join('');
  dots.querySelectorAll('.slide-dot').forEach(dot => {
    dot.addEventListener('click', () => {
      currentSlide = parseInt(dot.dataset.index);
      applyImageSlidePositions(); updateIndicator(); updateActionBox(); pushHash();
    });
  });
}

function updateIndicator(){
  const n = slideCount(curSession());
  document.getElementById('slide-counter').textContent = `${pad(currentSlide+1)} / ${pad(n)}`;
  document.querySelectorAll('.slide-dot').forEach((d,i) => d.classList.toggle('active', i===currentSlide));

  const total = COURSES[currentCourse].sessions.length;
  document.getElementById('btn-prev').disabled = (currentSession===0 && currentSlide===0);
  document.getElementById('btn-next').disabled = (currentSession===total-1 && currentSlide===n-1);
}

// 슬라이드 이동 — 경계에서 이전/다음 회차로 넘어간다
function goToSlide(delta){
  const n = slideCount(curSession());
  const next = currentSlide + delta;
  const total = COURSES[currentCourse].sessions.length;

  if (next < 0){
    if (currentSession > 0){
      const prev = COURSES[currentCourse].sessions[currentSession-1];
      goToSession(currentSession-1, slideCount(prev)-1);
    }
  } else if (next >= n){
    if (currentSession < total-1) goToSession(currentSession+1, 0);
  } else {
    currentSlide = next;
    applyImageSlidePositions(); updateIndicator(); updateActionBox(); pushHash();
  }
}

function goToSession(index, slideIndex = 0){
  const total = COURSES[currentCourse].sessions.length;
  if (index < 0 || index >= total) return;
  currentSession = index;
  currentSlide   = slideIndex;
  applySlidePositions(); applyImageSlidePositions();
  renderDots(); updateIndicator(); updateSidebarActive(); updateActionBox(); pushHash();
}

function switchCourse(key){
  if (!COURSES[key]) return;
  currentCourse = key; currentSession = 0; currentSlide = 0;
  document.querySelectorAll('.course-tab').forEach(t => t.classList.toggle('active', t.dataset.course===key));
  renderSlides(); applySlidePositions(); applyImageSlidePositions();
  renderSidebar(); renderDots(); updateIndicator(); updateActionBox(); pushHash();
}

/* ============================================================
   Fullscreen
   ============================================================ */
function fsUpdate(){
  const s = curSession(), sl = curSlideObj(), img = document.getElementById('fs-img');
  img.src = sl.image ? imagePath(currentCourse, s.step, sl.image) : '';
  img.alt = s.title;
  const n = slideCount(s);
  document.getElementById('fs-counter').textContent = `${pad(currentSlide+1)} / ${pad(n)}`;
  const total = COURSES[currentCourse].sessions.length;
  document.getElementById('fs-prev').disabled = (currentSession===0 && currentSlide===0);
  document.getElementById('fs-next').disabled = (currentSession===total-1 && currentSlide===n-1);
}
const fsOpen  = () => { document.getElementById('fs-overlay').removeAttribute('hidden'); fsUpdate(); };
const fsClose = () => document.getElementById('fs-overlay').setAttribute('hidden','');

/* ============================================================
   Events + Init
   ============================================================ */
document.getElementById('sidebar-toggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.add('collapsed');
  document.getElementById('sidebar-reopen').classList.add('visible');
});
document.getElementById('sidebar-reopen').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('collapsed');
  document.getElementById('sidebar-reopen').classList.remove('visible');
});
document.getElementById('btn-prev').addEventListener('click', () => goToSlide(-1));
document.getElementById('btn-next').addEventListener('click', () => goToSlide(1));

// 복사 행 클릭 (이벤트 위임 — innerHTML 재생성에 영향받지 않음)
document.addEventListener('click', e => {
  const row = e.target.closest('.action-copy-row');
  if (row) copyToClipboard(row.dataset.copy, row);
  if (e.target.closest('.image-expand-btn')) fsOpen();
  if (e.target.closest('#fs-close')) fsClose();
});
document.getElementById('fs-prev').addEventListener('click', () => { goToSlide(-1); fsUpdate(); });
document.getElementById('fs-next').addEventListener('click', () => { goToSlide(1);  fsUpdate(); });

document.addEventListener('keydown', e => {
  const fs = !document.getElementById('fs-overlay').hidden;
  if (e.key === 'Escape' && fs) fsClose();
  if (e.key === 'ArrowLeft')  { goToSlide(-1); if (fs) fsUpdate(); }
  if (e.key === 'ArrowRight') { goToSlide(1);  if (fs) fsUpdate(); }
});

document.addEventListener('DOMContentLoaded', () => {
  readHash();
  renderTabs(); renderSlides();
  applySlidePositions(); applyImageSlidePositions();
  renderSidebar(); renderDots(); updateIndicator(); updateActionBox(); pushHash();
});
</script>
</body>
</html>
